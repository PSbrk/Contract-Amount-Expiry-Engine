name: provision

# Manual-only workflow to create / verify the 8 Airtable tables.
# Idempotent — tables that already exist are left alone. Safe to re-run
# any time the schema needs to be reconciled (e.g. after editing
# config/airtable_schema.py).
#
# Run from: Actions → provision → Run workflow.
#
# Inputs:
#   dry_run: 'true' prints the plan without creating anything; 'false'
#            actually creates missing tables/fields. Default 'false'
#            since the operation is idempotent — re-running on an
#            already-provisioned base is a no-op.
#
# Secrets used: AIRTABLE_PAT, AIRTABLE_BASE_ID.
# (ASANA_PAT not needed — provision touches Airtable only.)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (preview only, no changes)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run --provision
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m engine.main --provision --dry-run
          else
            python -m engine.main --provision
          fi
