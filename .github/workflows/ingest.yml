name: ingest

# Daily Contract Amount Expiry Engine ingest pass.
#
#   schedule:    07:00 UTC = 02:00 CT (a few hours after the Tableau workbook
#                refreshes overnight). Operator can change the cron if Tableau
#                refresh time moves; the engine itself doesn't care when it runs.
#   workflow_dispatch:  manual trigger. The `dry_run_asana` input lets the
#                operator force-flip the safety gate from the GitHub UI without
#                editing the workflow file. Default 'true' is safe; flip to
#                'false' to allow real Asana writes.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   ASANA_PAT, AIRTABLE_PAT, AIRTABLE_BASE_ID
#
# A failed run posts to GitHub's Actions feed; the Run Log row (outcome=error)
# is the authoritative audit trail. Manual dispatch is the recovery path —
# re-run with dry_run_asana=true first to verify, then dry_run_asana=false to
# apply.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run_asana:
        description: "Dry-run Asana writes (true = log only; false = live writes)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      write_test_contract:
        description: "Restrict writes to a single Asana task GID (empty = all live contracts)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run --ingest
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          # Default to dry-run on the scheduled cron; honor the dispatch input
          # otherwise. The string default + conditional preserves the safety
          # default ("true") on cron triggers that don't carry inputs.
          DRY_RUN_ASANA: ${{ github.event.inputs.dry_run_asana || 'true' }}
          WRITE_TEST_CONTRACT: ${{ github.event.inputs.write_test_contract || '' }}
        run: python -m engine.main --ingest
